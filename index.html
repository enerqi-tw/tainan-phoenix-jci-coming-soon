*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{min-height:100vh;display:flex;flex-direction:column;font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC","Segoe UI",sans-serif;color:var(--text);line-height:1.7;
background:linear-gradient(180deg,rgba(4,10,28,.82),rgba(4,10,28,.96)),url("/assets/background.webp") center top/cover no-repeat;background-color:var(--navy)}
@media(min-width:761px){body{background-attachment:fixed}}
a{color:inherit;text-decoration:none}img{display:block;max-width:100%}
.wrap{width:min(1120px,calc(100% - 32px));margin:0 auto}
/* nav */
.nav{position:sticky;top:0;z-index:5;background:var(--navy-soft);border-bottom:1px solid rgba(217,180,96,.14);backdrop-filter:blur(16px)}
.nav .wrap{display:flex;align-items:center;gap:12px;min-height:68px}
.nav img{width:40px;height:40px;background:#fff;border-radius:10px;padding:2px}
.brand strong{display:block;color:var(--gold);letter-spacing:.1em;font-size:1rem;line-height:1.3}
.brand span{display:block;color:#d7deef;font-size:.66rem;letter-spacing:.18em;text-transform:uppercase}
/* hero */
main{flex:1;padding:20px 0 48px}
.hero{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--pb);box-shadow:var(--shadow);background:#3a2408 url("/assets/phoenix.webp") 70% center/cover no-repeat;min-height:430px;display:flex;align-items:flex-end}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,19,45,.18),rgba(8,19,45,.72)),radial-gradient(circle at center,rgba(255,240,208,.06),transparent 40%);pointer-events:none}
.copy{position:relative;z-index:2;padding:26px 20px;width:100%}
.logo{width:84px;height:auto;background:#fff;border-radius:18px;padding:6px;border:1px solid var(--pb);filter:drop-shadow(0 6px 18px rgba(0,0,0,.4));margin-bottom:14px}
.eyebrow{display:inline-flex;padding:6px 14px;border-radius:999px;background:rgba(9,21,53,.72);border:1px solid var(--pb);color:#f6e4b4;font-size:.78rem;letter-spacing:.12em}
h1{margin-top:14px;font-size:clamp(1.8rem,6vw,3.6rem);line-height:1.15;color:var(--cream);text-shadow:0 10px 28px rgba(0,0,0,.38);letter-spacing:.04em}
.en{margin-top:6px;color:#d8e0f4;font-size:.8rem;letter-spacing:.22em;text-transform:uppercase}
/* card */
.card{margin-top:24px;border-radius:22px;padding:30px 22px;text-align:center;background:var(--panel);border:1px solid var(--pb);box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.card h2{color:var(--gold);font-size:clamp(1.5rem,4.4vw,2.4rem);letter-spacing:.14em}
.card h2::after{content:"";display:block;width:72px;height:2px;margin:12px auto 0;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.cs{margin-top:14px;color:var(--gold-l);font-weight:700;letter-spacing:.3em;text-transform:uppercase;font-size:.9rem}
.card p{margin-top:8px;color:var(--muted);font-size:.95rem}
.dots{display:inline-flex;gap:8px;margin-top:18px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--gold);animation:p 1.4s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes p{0%,100%{opacity:.25;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.fade{animation:f .8s cubic-bezier(.4,0,.2,1) both}.d2{animation-delay:.15s}.d3{animation-delay:.3s}
@keyframes f{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.fade,.dots i{animation:none}}
/* footer */
footer{border-top:1px solid rgba(217,180,96,.12);background:rgba(4,10,28,.86);backdrop-filter:blur(12px);padding:24px 0 30px;color:var(--muted);font-size:.85rem}
footer .wrap{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.ft{display:flex;align-items:center;gap:10px}
.ft img{width:40px;height:40px;background:#fff;border-radius:10px;padding:2px}
.ft strong{color:var(--gold);letter-spacing:.08em}
.pw{display:inline-flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:999px;border:1px solid var(--pb);background:rgba(255,255,255,.04);transition:border-color .25s,background .25s}
.pw:hover{border-color:var(--gold);background:rgba(217,180,96,.08)}
.pw img{width:34px;height:30px;object-fit:contain;background:#fff;border-radius:999px;padding:3px}
.pw b{color:var(--gold-l)}

 footer .wrap{flex-direction:row;justify-content:space-between;text-align:left}
}
